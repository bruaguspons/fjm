name: Rust

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{env.RUST_VERSION}}
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{env.RUST_VERSION}}
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy -- -D warnings

  unit_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{env.RUST_VERSION}}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  build_release:
    runs-on: windows-latest
    name: "Release build for Windows"
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{env.RUST_VERSION}}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
      - uses: actions/upload-artifact@v4
        with:
          name: fjm-windows
          path: target/release/fjm.exe

  build_macos_release:
    runs-on: macos-latest
    name: "Release build for macOS"
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{env.RUST_VERSION}}
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: |
          cargo build --release --target x86_64-apple-darwin
          strip target/x86_64-apple-darwin/release/fjm
          cargo build --release --target aarch64-apple-darwin
          strip target/aarch64-apple-darwin/release/fjm

          mkdir -p target/release

          # create a universal binary
          lipo -create \
            target/x86_64-apple-darwin/release/fjm \
            target/aarch64-apple-darwin/release/fjm \
            -output target/release/fjm
        env:
          LZMA_API_STATIC: "true"
      - name: Strip binary from debug symbols
        run: strip target/release/fjm
      - name: List dynamically linked libraries
        run: otool -L target/release/fjm
      - uses: actions/upload-artifact@v4
        with:
          name: fjm-macos
          path: target/release/fjm

  e2e_macos:
    runs-on: macos-latest
    needs: [build_macos_release]
    name: "e2e/macos"
    steps:
      - uses: actions/checkout@v4
      - name: install necessary shells
        run: brew install fish zsh bash
      - uses: actions/download-artifact@v4
        with:
          name: fjm-macos
          path: target/release
      - name: mark binary as executable
        run: chmod +x target/release/fjm
      - uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "pnpm"
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "::set-output name=pnpm_cache_dir::$(pnpm store path)"
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm test
        env:
          FJM_TARGET_NAME: "release"
          FORCE_COLOR: "1"

  e2e_windows:
    runs-on: windows-latest
    needs: [build_release]
    name: "e2e/windows"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fjm-windows
          path: target/release
      - uses: MinoruSekine/setup-scoop@v4
      - uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "pnpm"
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "::set-output name=pnpm_cache_dir::$(pnpm store path)"
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm test
        env:
          FJM_TARGET_NAME: "release"
          FORCE_COLOR: "1"

  # e2e_windows_debug:
